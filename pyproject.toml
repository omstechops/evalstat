[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalstat"
version = "0.0.1"
description = "Statistical validity tooling for LLM and agent evaluations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "omstechops", email = "325673804+omstechops@users.noreply.github.com" }]
keywords = ["evaluation", "statistics", "llm", "power-analysis", "bootstrap"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/omstechops/evalstat"
Issues = "https://github.com/omstechops/evalstat/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/evalstat"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["evalstat"]
branch = true

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "D",    # pydocstyle
    "ANN",  # missing type annotations
    "NPY",  # numpy-specific rules
    "RUF",
]
ignore = [
    "D107",  # __init__ docstring lives on the class
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# Tests describe themselves through their names; no docstring/annotation nagging.
"tests/**" = ["D100", "D103", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
